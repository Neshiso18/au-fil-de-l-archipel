<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.extrait | default: site.description | strip_html | escape }}">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500&family=Shippori+Mincho+B1:wght@800&family=Noto+Serif+JP:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
{% feed_meta %}
<style>
:root{--bg:#F7F5F0;--card:#FFFFFF;--tx:#1C1C1C;--mu:#6a675f;--red:#C82D2D;--ln:#e0dbcf;color-scheme:light;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--tx);font:400 16px/1.65 'Inter',system-ui,sans-serif}
a{color:inherit}
header{--tx:#EEECE7;--mu:#A0A0A0;--ln:#2c2c2c;background:#111;color:var(--tx);text-align:center;padding:calc(48px + env(safe-area-inset-top,0px)) 20px 0}
header h1{font:800 clamp(2.2rem,6vw,4.4rem)/1.1 'Shippori Mincho B1','Noto Serif JP','Playfair Display',Georgia,serif;margin:0;letter-spacing:.03em}
header h1 a{text-decoration:none;color:inherit}
header p{color:var(--mu);margin:14px 0 22px;font-size:.95rem;letter-spacing:.04em}
.rule{height:1px;background:var(--red);border:0;margin:0 auto;max-width:1180px}
nav{display:flex;justify-content:center;gap:clamp(14px,4vw,44px);padding:16px 0;max-width:1180px;margin:0 auto;flex-wrap:wrap}
nav a{color:var(--mu);text-decoration:none;font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;padding:4px 0;border-bottom:1px solid transparent;transition:.2s}
nav a:hover,nav a.on{color:var(--tx);border-color:var(--red)}
main{max-width:1180px;margin:auto;padding:40px 20px 70px;animation:f .4s ease}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.tag{color:var(--red);font-size:.72rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
.meta{color:var(--mu);font-size:.8rem}
h2.sec{font:500 1.5rem 'Playfair Display',serif;margin:56px 0 22px;padding-bottom:10px;border-bottom:1px solid var(--ln);display:flex;align-items:baseline;gap:12px}
h2.sec small{font:400 .85rem 'Noto Serif JP',serif;color:var(--mu)}
#featured{--tx:#EEECE7;--mu:#A0A0A0;--ln:#2c2c2c;--card:#1a1a1a;color:var(--tx);background:#111;margin:-40px calc(50% - 50vw) 0;padding:56px calc(50vw - 50%) 64px}#featured .tag{color:#e5484d}
.feat{display:grid;grid-template-columns:1fr 1.1fr;gap:40px;align-items:center;text-decoration:none;color:inherit}
.feat h3{font:700 clamp(1.8rem,3.4vw,2.7rem)/1.15 'Playfair Display','Noto Serif JP',serif;margin:12px 0}
.feat p{color:var(--mu);margin:14px 0 0}
.img{width:100%;aspect-ratio:16/10;overflow:hidden;background:var(--card);border:1px solid var(--ln)}
.img svg{width:100%;height:100%;display:block;transition:transform .6s}
.card:hover .img svg,.feat:hover .img svg{transform:scale(1.04)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.card{background:var(--card);text-decoration:none;color:inherit;display:flex;flex-direction:column;border:1px solid var(--ln);transition:.25s}
.card:hover{border-color:var(--red);transform:translateY(-3px);box-shadow:0 10px 26px rgba(28,28,28,.09)}
.card .img{border:0;border-bottom:1px solid var(--ln);aspect-ratio:16/9}
.card .b{padding:20px 22px 24px;display:flex;flex-direction:column;gap:9px;flex:1}
.card h3{font:700 1.3rem/1.25 'Playfair Display','Noto Serif JP',serif;margin:0}
.card p{color:var(--mu);font-size:.92rem;margin:0;flex:1}
.demarche-box{background:var(--card);border-left:2px solid var(--red);padding:30px 34px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}
.demarche-box p{margin:8px 0 0;color:var(--mu);max-width:62ch}
.btn{display:inline-block;background:none;color:var(--tx);border:1px solid var(--red);padding:10px 22px;font:500 .78rem Inter;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:.2s}
.btn:hover,.feat:hover .btn{background:var(--red);color:#fff}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 30px}
.filters button{background:none;border:1px solid var(--ln);color:var(--mu);padding:7px 16px;font:500 .76rem Inter;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:.2s}
.filters button:hover{color:var(--tx)}.filters button.on{border-color:var(--red);color:var(--red);background:#fff}
.prose{max-width:720px;margin:auto}
.prose h2{font:700 clamp(2rem,4.5vw,3rem)/1.12 'Playfair Display','Noto Serif JP',serif;margin:10px 0 24px}
.prose h3{font:500 1.35rem 'Playfair Display',serif;margin:38px 0 8px}
.prose p{margin:0 0 1.3em;font-size:1.04rem}
.prose .lead{font-size:1.2rem;color:var(--tx)}
.prose ul{padding-left:20px;color:var(--mu)}.prose li{margin-bottom:.6em}.prose li b,.prose li strong{color:var(--tx);font-weight:600}
.jp{font-family:'Noto Serif JP',serif;color:var(--mu)}
.art{max-width:740px;margin:auto}
.art h1{font:700 clamp(2rem,5vw,3.3rem)/1.1 'Playfair Display','Noto Serif JP',serif;margin:14px 0 18px}
.art .chap{font:italic 500 1.25rem/1.5 'Playfair Display',serif;color:var(--mu);margin:0 0 26px}
.art .img{margin:26px 0 34px;aspect-ratio:21/9}
.art .body p{font-size:1.07rem;line-height:1.8;margin:0 0 1.4em}
.art .body>p:first-child::first-letter{font:700 3.6rem/.85 'Playfair Display',serif;float:left;padding:6px 10px 0 0;color:var(--red)}
.art .body h2{font:500 1.4rem 'Playfair Display',serif;margin:2em 0 .6em}
.art .body blockquote{margin:2em 0;padding:4px 0 4px 26px;border-left:2px solid var(--red);font:italic 500 1.45rem/1.45 'Playfair Display','Noto Serif JP',serif}
.art .body blockquote p{font:inherit;margin:0}
.back{display:inline-block;color:var(--mu);text-decoration:none;font:500 .78rem Inter;letter-spacing:.14em;text-transform:uppercase;padding:0 0 26px}
.back:hover{color:var(--tx)}
.note{border-top:1px solid var(--ln);margin-top:44px;padding-top:18px;color:var(--mu);font-size:.85rem}
footer{border-top:1px solid var(--ln);text-align:center;color:var(--mu);font-size:.78rem;padding:28px 20px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.feat{grid-template-columns:1fr;gap:22px}.feat .img{order:-1}.demarche-box{grid-template-columns:1fr}}
@media(max-width:580px){.grid{grid-template-columns:1fr}header{padding-top:calc(34px + env(safe-area-inset-top,0px))}#featured{padding-top:40px;padding-bottom:48px}.art .body blockquote{font-size:1.2rem}}
</style>
</head>
<body>
{%- assign nav = page.nav -%}
{%- if page.layout == 'post' -%}{%- assign nav = 'analyses' -%}{%- endif -%}
<header>
<h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
<p>{{ site.tagline }}</p>
<hr class="rule">
<nav>
<a href="{{ '/' | relative_url }}"{% if nav == 'accueil' %} class="on"{% endif %}>Accueil</a>
<a href="{{ '/analyses/' | relative_url }}"{% if nav == 'analyses' %} class="on"{% endif %}>Analyses</a>
<a href="{{ '/demarche/' | relative_url }}"{% if nav == 'demarche' %} class="on"{% endif %}>Démarche</a>
<a href="{{ '/apropos/' | relative_url }}"{% if nav == 'apropos' %} class="on"{% endif %}>À propos</a>
</nav>
</header>
<main>
{{ content }}
</main>
<footer>© {{ 'now' | date: '%Y' }} {{ site.title }} — Revue indépendante · 日本 · Paris</footer>
</body>
</html>
